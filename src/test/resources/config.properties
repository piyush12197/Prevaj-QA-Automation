# Default test configuration.
#
# Any value can be overridden without editing this file. Precedence, highest first:
#   1. JVM system property:   .\gradlew.bat clean test "-Dui.browser=firefox"
#   2. Environment variable:  the key in upper case with dots replaced by underscores, e.g. UI_BROWSER=firefox
#   3. The value in this file
# Blank overrides are ignored. Gradle forwards each key in this file from its own -D options to the test JVM.
#
# The optional ReqRes API key is read only from the REQRES_API_KEY environment variable.
# When it is set and not blank, it is sent as the x-api-key header. Never add it to this or any other committed file.

# ReqRes API
reqres.base.url=https://reqres.in
reqres.base.path=/api
reqres.connect.timeout.seconds=10
reqres.read.timeout.seconds=30

# SauceDemo UI. Supported browsers: chrome, firefox
saucedemo.base.url=https://www.saucedemo.com/
ui.browser=chrome
ui.headless=false
ui.explicit.wait.seconds=10
