plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation platform('io.cucumber:cucumber-bom:8.1.0')
    testImplementation platform('org.junit:junit-bom:6.1.3')

    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'io.rest-assured:rest-assured:6.3.0'
    testRuntimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    testImplementation 'org.hamcrest:hamcrest:3.0'

    testImplementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.54.0'
    testImplementation 'org.seleniumhq.selenium:selenium-support:4.54.0'
}

tasks.named('test') {
    useJUnitPlatform()

    def cucumberTags = providers.systemProperty('cucumber.filter.tags')
    if (cucumberTags.present) {
        systemProperty 'cucumber.filter.tags', cucumberTags.get()
    }
}
