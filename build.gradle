plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def seleniumVersion = '4.54.0'
def jacksonVersion = '2.22.4'

dependencies {
    testImplementation platform('io.cucumber:cucumber-bom:8.1.0')
    testImplementation platform('org.junit:junit-bom:6.1.3')

    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'io.rest-assured:rest-assured:6.3.0'
    // REST Assured serializes JSON request bodies with Jackson.
    // Cucumber's HTML and JSON reports need Jackson with the JDK 8 module.
    testRuntimeOnly "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    testRuntimeOnly "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jacksonVersion}"
    testImplementation 'org.hamcrest:hamcrest:3.0'

    testImplementation "org.seleniumhq.selenium:selenium-chrome-driver:${seleniumVersion}"
    testImplementation "org.seleniumhq.selenium:selenium-firefox-driver:${seleniumVersion}"
    testImplementation "org.seleniumhq.selenium:selenium-support:${seleniumVersion}"
}

tasks.named('test') {
    useJUnitPlatform()

    // Forward -D overrides for cucumber.filter.tags and every key in config.properties to the test JVM.
    def configKeys = new Properties()
    file('src/test/resources/config.properties').withInputStream { configKeys.load(it) }
    (['cucumber.filter.tags'] + configKeys.stringPropertyNames().sort()).each { key ->
        def override = providers.systemProperty(key)
        if (override.present) {
            systemProperty key, override.get()
        }
    }

    // The tests run against live services and read environment variable overrides, so always run them.
    outputs.upToDateWhen { false }
}
